---
AWSTemplateFormatVersion: 2010-09-09
Description: WhatFood Today Default EC2_Layer Template for the Project

Parameters:
  ProjectName:
    Type: String
    Description: Project Name
    Default: wft
  RdsRegion:
    Type: String
    Default: ap-northeast-2
  RegionName:
    Type: String
    Description: Region Name
    AllowedValues:
      - seoul
      - tokyo

Mappings:
  CidrMap:
    ap-northeast-2:
      VpcCidr: 172.16.0.0/16
      PubSn1Cidr: 172.16.1.0/24
      PubSn2Cidr: 172.16.2.0/24
      WebSn3Cidr: 172.16.3.0/24
      WebSn4Cidr: 172.16.4.0/24
      RdsSn5Cidr: 172.16.5.0/24
      RdsSn6Cidr: 172.16.6.0/24
    ap-northeast-1:
      VpcCidr: 172.17.0.0/16
      PubSn1Cidr: 172.17.1.0/24
      PubSn2Cidr: 172.17.2.0/24
      WebSn3Cidr: 172.17.3.0/24
      WebSn4Cidr: 172.17.4.0/24
  AmiMap:
    ap-northeast-2:
      Ami: ami-054b40a72f40ad9b3
    ap-northeast-1:
      Ami: ami-0cfcf03a463783e35

Resources:
# Web Application Load Balancer & Security Group
  WebAlbSg:
    Type: AWS::EC2::SecurityGroup
    Properties:
      VpcId: !ImportValue VpcId
      GroupDescription: !Sub "${AWS::Region} Web ALB Security Group"
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
      Tags:
        - Key : Name
          Value : !Sub "${RegionName}-${ProjectName}-web-alb-sg"

  WebAlb:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Scheme: internet-facing
      Name: !Sub "${RegionName}-${ProjectName}-web-alb"
      SecurityGroups:
        - !Ref WebAlbSg
      Subnets:
        - !ImportValue PubSn1Id
        - !ImportValue PubSn2Id

  WebAlbTg:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub "${RegionName}-${ProjectName}-web-tg"
      Port: 80
      Protocol: HTTP
      HealthCheckPath: '/'
      HealthCheckIntervalSeconds: 10
      HealthyThresholdCount: 3
      UnhealthyThresholdCount: 3
      VpcId: !ImportValue VpcId
      TargetGroupAttributes:
        - Key: stickiness.enabled
          Value: true
        - Key: stickiness.type
          Value: lb_cookie
        - Key: stickiness.lb_cookie.duration_seconds
          Value: 3600
      Tags:
        - Key : Name
          Value : !Sub "${RegionName}-${ProjectName}-web-tg"

  WebAlbListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref WebAlbTg
      LoadBalancerArn: !Ref WebAlb
      Port: 80
      Protocol: HTTP

# LaunchTemplate & Security Group
  WebSg:
    Type: AWS::EC2::SecurityGroup
    Properties:
      VpcId: !ImportValue VpcId
      GroupDescription: !Sub "${AWS::Region} Web Instance Security Group"
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: !FindInMap [CidrMap, ap-northeast-2, PubSn2Cidr]
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          SourceSecurityGroupId: !Ref WebAlbSg
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          SourceSecurityGroupId: !Ref WebAlbSg
        - IpProtocol: icmp
          FromPort: -1
          ToPort: -1
          CidrIp: 10.0.0.0/8
      Tags:
        - Key : Name
          Value : !Sub "${RegionName}-${ProjectName}-web-sg"

  WebInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        # 💡 수동으로 만들어 두신 최신 IAM 역할을 다이렉트로 매핑합니다.
        - "whatfood-web-ssm-role"

  LaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateName: !Sub "${ProjectName}-lt"
      VersionDescription: version 1.0
      LaunchTemplateData:
        ImageId: !FindInMap [AmiMap, !Ref "AWS::Region", Ami]
        InstanceType: t3.micro

        IamInstanceProfile:
          Name: !Ref WebInstanceProfile

        KeyName: !Sub "${RegionName}-${ProjectName}-key"
        SecurityGroupIds:
          - !Ref WebSg
        UserData:
          # [해결] 꼬여있던 기존 sed 치환 코드를 완전히 제거하여 RDS_ENDPOINT 의존성 에러를 완벽히 해결했습니다!
          Fn::Base64: !Sub |
            #!/bin/bash
            # 1. SSM 파라미터 스토어에서 내 맞춤형 구조(db_host, db_password) 실시간 동기화
            DB_HOST=$(aws ssm get-parameter --name "db_host" --query "Parameter.Value" --output text --region ${RdsRegion})
            DB_PASS=$(aws ssm get-parameter --name "db_password" --with-decryption --query "Parameter.Value" --output text --region ${RdsRegion})
            
            # 2. db.php가 바라보는 최신 주소 파일 구워주기
            echo "DB_HOST=$DB_HOST" > /var/www/db_config.ini
            echo "DB_PASSWORD=$DB_PASS" >> /var/www/db_config.ini
            chmod 600 /var/www/db_config.ini
            chown apache:apache /var/www/db_config.ini
            
            # 3. 데이터베이스 SSL 암호화 통과를 위한 AWS 마스터 신용인증서 수급 배치
            mkdir -p /etc/pki/tls/certs
            wget https://truststore.pki.rds.amazonaws.com/global/global-bundle.pem -O /etc/pki/tls/certs/aws-rds-global-bundle.pem
            chmod 644 /etc/pki/tls/certs/aws-rds-global-bundle.pem
            
            # 4. 파이썬 Gunicorn 백엔드가 리전 누락 에러로 뻗지 않도록 환경변수 심어주기
            if ! grep -q "AWS_DEFAULT_REGION" /etc/systemd/system/whatfood.service; then
              sed -i '/\[Service\]/a Environment="AWS_DEFAULT_REGION=ap-northeast-2"' /etc/systemd/system/whatfood.service
              systemctl daemon-reload
            fi
            wget https://github.com/wisdompjt-wft/aws-wft-project/raw/main/init_db.php -O /var/www/html/init_db.php
            sed -i "s/DirectoryIndex index.html/DirectoryIndex index.php index.html/g" /etc/httpd/conf/httpd.conf
            sed -i "s/127.0.0.1/$DB_HOST/g" /var/www/html/db.php
            sed -i "s/= '1234';/= '$DB_PASS';/g" /var/www/html/db.php
            # 5. 모든 캐시 털어내고 아파치와 파이썬 백엔드 기동
            systemctl restart whatfood
            systemctl restart httpd
            systemctl enable httpd
            systemctl enable whatfood
            # [리전별 분기 처리] 서울 리전(ap-northeast-2)에서만 DB 초기화 및 CSV 마이그레이션 실행
            if [ "${AWS::Region}" = "ap-northeast-2" ]; then
              php /var/www/html/init_db.php
              rm -f /var/www/html/init_db.php
              
              # [보안/개선] 각 파일이 위치해야 할 절대 경로로 직접 다운로드 처리 (-O 옵션 활용)
              wget https://github.com/wisdompjt-wft/aws-wft-project/raw/main/import_csv_seoul.py -O /home/ec2-user/whatfood/import_csv_seoul.py
              wget https://github.com/wisdompjt-wft/aws-wft-project/raw/main/real_foods.csv -O /var/www/html/real_foods.csv
              
              cd /home/ec2-user/whatfood
              source venv/bin/activate
              python import_csv_seoul.py
            else
              # 도쿄 리전 등에서는 마이그레이션을 안 하므로 다운받았던 init_db.php 파일만 깔끔하게 청소합니다.
              rm -f /var/www/html/init_db.php
            fi

# Auto Scaling Group & Scaling Policy
  AutoScalingGroup:
    Type: AWS::AutoScaling::AutoScalingGroup
    Properties:
      AutoScalingGroupName: !Sub "${RegionName}-${ProjectName}-asg"
      LaunchTemplate:
        LaunchTemplateId: !Ref LaunchTemplate
        Version: !GetAtt LaunchTemplate.LatestVersionNumber
      VPCZoneIdentifier:
        - !ImportValue WebSn3Id
        - !ImportValue WebSn4Id
      TargetGroupARNs:
        - !Ref WebAlbTg
      DesiredCapacity: 2
      MinSize: 2
      MaxSize: 4

  ScalingPolicy:
    Type: AWS::AutoScaling::ScalingPolicy
    Properties:
      AutoScalingGroupName: !Ref AutoScalingGroup
      PolicyType: TargetTrackingScaling
      TargetTrackingConfiguration:
        PredefinedMetricSpecification:
          PredefinedMetricType: ASGAverageCPUUtilization
        TargetValue: 50
...
